<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll Expedition</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#030207;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:520vh}
  canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.55}
  .scene{position:fixed;inset:0;overflow:hidden;perspective:1000px}
  .vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#31105d44,#030207 68%)}
  nav{position:fixed;z-index:3;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#d9c9ff}
  nav div{display:flex;gap:8px}.pill{border:1px solid #7d5cc855;border-radius:999px;padding:8px 13px;background:#07030fcc;color:inherit;text-decoration:none}
  h1{position:fixed;z-index:3;left:28px;top:15vh;margin:0;max-width:780px;font-size:clamp(44px,9vw,110px);line-height:.86;letter-spacing:0;text-shadow:0 0 28px #6f38ff66}
  .stage{position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d}
  .mock{position:absolute;width:min(56vw,520px);height:min(78vh,680px);border:2px solid #8d55ff;background:#ffffff0b;box-shadow:0 0 52px #6f38ff22;opacity:.78}
  .block{position:absolute;left:24%;right:24%;height:10%;background:#8f55ff;box-shadow:0 0 22px #7138ff44}
  .block:nth-child(1){top:7%}.block:nth-child(2){top:22%}.block:nth-child(3){top:66%}.block:nth-child(4){top:82%}
  .card{position:absolute;width:min(48vw,430px);height:120px;border:1px solid #b98cff88;border-radius:3px;background:linear-gradient(135deg,#ca63dd,#6c25f1);box-shadow:0 0 50px #6f38ff44;display:grid;place-items:center;will-change:transform,opacity,filter}
  .card b{font-size:clamp(24px,3.8vw,42px);line-height:.95;text-align:center;color:#fff;text-shadow:0 0 14px #2b084f}
  .a{transform:translate3d(0,0,0) rotateX(8deg) rotateY(-12deg)}
  .b{transform:translate3d(70vw,4vh,-120px) rotateY(-36deg);opacity:.45}
  .c{transform:translate3d(-65vw,12vh,-220px) rotateY(36deg);opacity:.3}
  .line{position:absolute;width:1px;height:70vh;background:linear-gradient(#0000,#a98cff,#0000);left:50%;top:15vh;opacity:.5}
  .hud{position:fixed;z-index:3;left:28px;bottom:28px;right:28px;display:flex;justify-content:space-between;align-items:end;color:#baa9df;font-size:14px}
  .bar{width:min(360px,45vw);height:2px;background:#ffffff1c}.bar i{display:block;width:0;height:100%;background:#a98cff}
  .hint{max-width:330px}
  @media(max-width:700px){
    body{min-height:620vh}
    nav{left:16px;right:16px;top:16px}.pill{display:none}
    h1{left:16px;top:9vh;max-width:340px;font-size:clamp(38px,14vw,58px)}
    .mock{width:78vw;height:64vh;top:22vh}
    .block{left:25%;right:25%;height:10%}
    .card{width:58vw;height:78px}
    .card b{font-size:clamp(20px,7vw,30px)}
    .line{opacity:.25}
    .hud{left:16px;right:16px;bottom:18px;display:block;font-size:12px}
    .hint{display:block;max-width:78vw}
    .bar{width:100%;margin-top:12px}
  }
</style>
<canvas id="fx"></canvas>
<main class="scene">
  <div class="vignette"></div>
  <nav><strong>Creative Expedition</strong><div><span class="pill">Home</span><a class="pill" href="https://instagram.com/marcosneto.dev" target="_blank" rel="noreferrer">@marcosneto.dev</a></div></nav>
  <h1 id="title">Projetos em movimento.</h1>
  <section class="stage">
    <i class="line"></i>
    <div class="mock"><i class="block"></i><i class="block"></i><i class="block"></i><i class="block"></i></div>
    <div class="card a"><b id="w1">MN<br>CHECK</b></div>
    <div class="card b"><b id="w2">BIBLIOTECA</b></div>
    <div class="card c"><b id="w3">MAIS<br>PROJETOS</b></div>
  </section>
  <footer class="hud"><span class="hint" id="desc">Validador inteligente para conferir pedidos, PDFs e dados operacionais com mais velocidade.</span><span class="bar"><i id="bar"></i></span></footer>
</main>
<script>
const c=fx,ctx=c.getContext("2d"),cards=[...document.querySelectorAll(".card")];
const projects=[
  ["MN\nCHECK","Validador inteligente para conferir pedidos, PDFs e dados operacionais com mais velocidade."],
  ["BIBLIOTECA","Sistema simples para organizar acervo, consultas e fluxo de controle de uma biblioteca."],
  ["MAIS\nPROJETOS","Mais projetos em breve..."]
];
let w,h,pts=[]; onresize=()=>{w=c.width=innerWidth;h=c.height=innerHeight;pts=Array.from({length:90},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.7+.4,v:Math.random()*.25+.08}))}; onresize();
function lerp(a,b,t){return a+(b-a)*t}
function draw(){
  ctx.clearRect(0,0,w,h); ctx.fillStyle="#b28cff";
  pts.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=h;p.x=Math.random()*w}ctx.globalAlpha=.15+p.s*.12;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()});
  requestAnimationFrame(draw)
} draw();
function tick(){
  const max=document.body.scrollHeight-innerHeight, p=max?scrollY/max:0, seg=Math.min(2,Math.floor(p*3)), local=p*3-seg;
  title.style.transform=`translateY(${lerp(0,-70,p)}px)`; title.style.opacity=1-p*.75; bar.style.width=(p*100)+"%"; desc.innerText=projects[seg][1];
  w1.innerText=projects[seg][0]; w2.innerText=projects[Math.min(seg+1,2)][0]; w3.innerText=projects[Math.min(seg+2,2)][0];
  const m=innerWidth<700;
  cards[0].style.transform=`translate3d(${lerp(m?-5:-8,m?-22:-32,local)}vw,${lerp(2,-5,local)}vh,${lerp(45,150,local)}px) rotateY(${lerp(-8,28,local)}deg) scale(${lerp(1,.82,local)})`; cards[0].style.opacity=1-local*.5;
  cards[1].style.transform=`translate3d(${lerp(m?28:34,m?4:7,local)}vw,${lerp(-2,0,local)}vh,${lerp(-80,70,local)}px) rotateY(${lerp(-24,4,local)}deg) scale(${lerp(.9,1,local)})`; cards[1].style.opacity=.42+local*.58;
  cards[2].style.transform=`translate3d(${lerp(m?18:20,m?0:-6,local)}vw,${lerp(6,4,local)}vh,${lerp(-120,20,local)}px) rotateY(${lerp(-12,0,local)}deg) scale(.92)`; cards[2].style.opacity=.25+p*.55;
  requestAnimationFrame(tick)
} tick();
</script>
</html>
